name: Refresh data and deploy site

# Daily: refresh whatever is due (flights daily, hotels weekly, reference data monthly), export the site
# snapshot, check the browser engine against the Python engine, deploy to Cloudflare Pages (farenoughtrips.com,
# project "farenough") and to GitHub Pages (the old address, kept until the new one is confirmed).
# The database lives in the Actions cache between runs. If the cache is lost, `refresh auto` rebuilds it
# from scratch (about 6 minutes). If the API keys are not configured, the committed snapshot is deployed.

on:
  schedule:
    - cron: "17 9 * * *" # 09:17 UTC = 04:17 Toronto (EST)
  push:
    branches: [main]
    paths: ["site/**", "backend/**", "data/seed/**", "functions/**", ".github/workflows/pages.yml"]
  workflow_dispatch:
    inputs:
      force:
        description: "Steps to run even if fresh (comma-separated: reference,select,flights,hotels)"
        required: false
        default: ""

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false # never kill a refresh half-way

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TRIPFINDER_DB: ${{ github.workspace }}/var/tripfinder.db
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.4.0

      - name: Install backend
        working-directory: backend
        run: uv sync --locked

      - name: Backend tests
        working-directory: backend
        run: uv run pytest -q

      - name: Restore database
        uses: actions/cache/restore@v6
        with:
          path: var/tripfinder.db
          key: tripdb-${{ github.run_id }}
          restore-keys: tripdb-

      - name: Refresh data
        id: refresh
        working-directory: backend
        env:
          TRAVELPAYOUTS_TOKEN: ${{ secrets.TRAVELPAYOUTS_TOKEN }}
          LITEAPI_KEY: ${{ secrets.LITEAPI_KEY }}
        run: |
          if [ -z "$TRAVELPAYOUTS_TOKEN" ] || [ -z "$LITEAPI_KEY" ]; then
            echo "::warning::TRAVELPAYOUTS_TOKEN or LITEAPI_KEY secret missing; deploying the committed data snapshot"
            echo "## Refresh skipped: API key secrets are not configured" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "## Refresh" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            uv run python -m tripfinder refresh auto --force "${{ inputs.force }}" | tee -a "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ -f "$TRIPFINDER_DB" ]; then echo "have_db=true" >> "$GITHUB_OUTPUT"; fi

      - name: Export site data
        if: steps.refresh.outputs.have_db == 'true'
        working-directory: backend
        run: |
          uv run python -m tripfinder export
          echo "## Data cost" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          uv run python -m tripfinder costs >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Save database
        if: steps.refresh.outputs.have_db == 'true'
        uses: actions/cache/save@v6
        with:
          path: var/tripfinder.db
          key: tripdb-${{ github.run_id }}

      - name: Photos and themes for new destinations
        if: steps.refresh.outputs.have_db == 'true'
        working-directory: backend
        run: |
          # Finds a real, credited Wikimedia Commons photo for any destination without one (for this deploy only;
          # commit it from a local run after a look). Missing theme rows are listed for a person or AI session.
          out=$(uv run python -m tripfinder assets --fill-photos)
          echo "$out"
          { echo "## Destination assets"; echo '```'; echo "$out"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          if echo "$out" | grep -qE "^(no photo|no theme row|photos added)"; then
            echo "::warning::A destination is missing a photo or theme row; see the run summary"
          fi

      - name: Destination and month pages
        working-directory: backend
        run: uv run python -m tripfinder pages

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Browser engine matches Python engine; pages are sound
        run: node --test site/tests/parity.test.mjs site/tests/pages.test.mjs

      - name: Leave tests out of the published site
        run: rm -rf site/tests

      - name: Keep the built site for the Cloudflare deploy
        uses: actions/upload-artifact@v4
        with:
          name: site
          path: site
          include-hidden-files: true
          retention-days: 3

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5

  # Cloudflare Pages: farenoughtrips.com. Secrets CLOUDFLARE_API_TOKEN (Account > Cloudflare Pages > Edit) and
  # CLOUDFLARE_ACCOUNT_ID. Creates the project and attaches the domains on the first run; later runs only deploy.
  cloudflare:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      PROJECT: farenough
    steps:
      - uses: actions/checkout@v7 # for functions/ (the www redirect)

      - uses: actions/download-artifact@v4
        with:
          name: site
          path: site

      - name: Create the Pages project if it doesn't exist
        id: project
        run: |
          if [ -z "$CF_TOKEN" ] || [ -z "$CF_ACCOUNT" ]; then
            echo "::warning::Cloudflare secrets missing; skipping the Cloudflare deploy"; exit 0
          fi
          echo "ok=true" >> "$GITHUB_OUTPUT"
          api="https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT/pages/projects"
          code=$(curl -s -o /tmp/p.json -w '%{http_code}' -H "Authorization: Bearer $CF_TOKEN" "$api/$PROJECT")
          if [ "$code" = "404" ]; then
            curl -sf -X POST -H "Authorization: Bearer $CF_TOKEN" -H "Content-Type: application/json"               -d "{\"name\":\"$PROJECT\",\"production_branch\":\"main\"}" "$api" > /dev/null
            echo "Created Pages project $PROJECT"
          elif [ "$code" != "200" ]; then
            echo "::error::Cloudflare API answered $code for the project lookup"; jq -c '.errors' /tmp/p.json; exit 1
          fi

      - name: Deploy to Cloudflare Pages
        if: steps.project.outputs.ok == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy site --project-name=farenough --branch=main --commit-dirty=true

      - name: Custom domains
        if: steps.project.outputs.ok == 'true'
        run: |
          api="https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT/pages/projects/$PROJECT/domains"
          for d in farenoughtrips.com www.farenoughtrips.com; do
            have=$(curl -s -H "Authorization: Bearer $CF_TOKEN" "$api/$d" | jq -r '.success')
            if [ "$have" != "true" ]; then
              curl -s -X POST -H "Authorization: Bearer $CF_TOKEN" -H "Content-Type: application/json"                 -d "{\"name\":\"$d\"}" "$api" | jq -c '{success, errors}'
            fi
          done
          echo "## Cloudflare custom domains" >> "$GITHUB_STEP_SUMMARY"
          curl -s -H "Authorization: Bearer $CF_TOKEN" "$api"             | jq -r '.result[] | "- \(.name): \(.status)\(if .verification_data.error_message then " (" + .verification_data.error_message + ")" else "" end)"'             | tee -a "$GITHUB_STEP_SUMMARY"
